spring:
  datasource:
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    url: ${DB_URL:jdbc:h2:mem:mall;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;NON_KEYWORDS=VALUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
  sql:
    init:
      mode: always
      # Execute MySQL-compatible DDL/DML against H2 in MySQL mode for preview/dev
      schema-locations: >
        classpath:/sql/mall_category.sql,
        classpath:/sql/mall_product.sql,
        classpath:/sql/mall_user.sql,
        classpath:/sql/mall_role.sql,
        classpath:/sql/mall_user_role.sql,
        classpath:/sql/mall_shipping.sql,
        classpath:/sql/mall_order.sql,
        classpath:/sql/mall_order_item.sql

logging:
  pattern:
    console: "[%thread] %-5level %logger{36} - %msg%n"

mybatis:
  type-aliases-package: com.tablu.mall.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:/mappers/*.xml

server:
  port: ${SERVER_PORT:3001}
